<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mandala floral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  canvas{ display:block; width:100%; height:100%; }
  canvas.settled{ animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe{
    0%,100%{ filter: drop-shadow(0 0 10px rgba(245,166,35,.28)); }
    50%{ filter: drop-shadow(0 0 22px rgba(245,166,35,.5)); }
  }
  .overlay{ position:fixed; left:0; right:0; bottom:26px; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    opacity:0; transition:opacity 1.1s ease; }
  .overlay p{ margin:0; font-family:"Fraunces",serif; font-style:italic; font-weight:400;
    font-size:.95rem; color:rgba(255,222,170,.72); letter-spacing:.01em; }
  .overlay button{ background:none; cursor:pointer; border:none;
    border-bottom:1px solid rgba(245,166,35,.4); color:rgba(255,200,120,.85);
    font-size:.82rem; font-family:inherit; letter-spacing:.02em; padding:2px 1px 4px 1px;
    transition:color .25s ease, border-color .25s ease; }
  .overlay button:hover{ color:#fff; border-color:rgba(245,166,35,.85); }
  .seed{ position:fixed; left:16px; bottom:14px; z-index:2;
    font-family:"IBM Plex Mono",monospace; font-size:.6rem; color:rgba(255,255,255,.2); }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="overlay" id="overlay">
  <p>una flor, trazada en vivo</p>
  <button id="regen">generar otra</button>
</div>
<div class="seed" id="seedTag"></div>

<script>
const MESSAGE = "";
const MESSAGE_COLOR = "rgba(255,236,200,.85)";

// ---------- PRNG ----------
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- color helpers ----------
function hexToRgb(hex){
  hex = hex.replace('#','');
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}
function lerpHex(a, b, t){
  const A = hexToRgb(a), B = hexToRgb(b);
  const r = Math.round(A[0]+(B[0]-A[0])*t), g = Math.round(A[1]+(B[1]-A[1])*t), bl = Math.round(A[2]+(B[2]-A[2])*t);
  return `rgb(${r},${g},${bl})`;
}

class Turtle{
  constructor(){ this.x=0; this.y=0; this.heading=0; this.down=true; this.col='#fff'; this.segments=[]; }
  setColor(c){ this.col=c; }
  penup(){ this.down=false; }
  pendown(){ this.down=true; }
  rt(a){ this.heading -= a; }
  lt(a){ this.heading += a; }
  goto(x,y){
    if(this.down) this.segments.push({type:'line', x1:this.x, y1:this.y, x2:x, y2:y, color:this.col});
    this.x = x; this.y = y;
  }
  forward(d){
    const r = this.heading*Math.PI/180;
    this.goto(this.x + d*Math.cos(r), this.y + d*Math.sin(r));
  }
  circle(radius, extent){
    const frac = Math.abs(extent)/360;
    const steps = Math.max(6, Math.round((10 + Math.abs(radius)/4) * frac));
    const turnDir = radius >= 0 ? 1 : -1;
    const R = Math.abs(radius);
    const centerAngle = this.heading + turnDir*90;
    const cx = this.x + R*Math.cos(centerAngle*Math.PI/180);
    const cy = this.y + R*Math.sin(centerAngle*Math.PI/180);
    const theta0 = turnDir===1 ? this.heading-90 : this.heading+90;
    for(let s=1; s<=steps; s++){
      const frac2 = s/steps;
      const theta = turnDir===1 ? theta0+frac2*extent : theta0-frac2*extent;
      const px = cx + R*Math.cos(theta*Math.PI/180);
      const py = cy + R*Math.sin(theta*Math.PI/180);
      if(this.down) this.segments.push({type:'line', x1:this.x, y1:this.y, x2:px, y2:py, color:this.col});
      this.x = px; this.y = py;
    }
    this.heading = turnDir===1 ? this.heading+extent : this.heading-extent;
  }
  stamp(color, r){
    this.segments.push({type:'dot', x:this.x, y:this.y, r, color});
  }
}

function buildProgram(seed){
  const rnd = mulberry32(seed);
  const t = new Turtle();
  t.penup(); t.goto(0,-40); t.pendown();

  const petalCounts = [10,12,15,16,18,20];
  const petalCount = petalCounts[Math.floor(rnd()*petalCounts.length)];
  const extentStep = 360/petalCount;
  const subSteps = 14 + Math.floor(rnd()*10);
  const radiusStart = 130 + Math.floor(rnd()*40);
  const targetMinRadius = 16 + Math.floor(rnd()*10);
  const radiusDec = (radiusStart - targetMinRadius) / (subSteps - 1);
  const repositionRadius = 30 + Math.floor(rnd()*25);

  const palettes = [
    ['#FFF3B0','#E8871E'], ['#FFEFAF','#D9720F'], ['#FFF6D6','#F5A623']
  ];
  const [colFar, colNear] = palettes[Math.floor(rnd()*palettes.length)];

  for(let i=0; i<petalCount; i++){
    for(let j=0; j<subSteps; j++){
      t.setColor(lerpHex(colFar, colNear, j/(subSteps-1)));
      t.rt(90);
      t.circle(radiusStart - j*radiusDec, 90);
      t.lt(90);
      t.circle(radiusStart - j*radiusDec, 90);
      t.rt(180);
    }
    t.circle(repositionRadius, extentStep);
  }

  // centro real del rosetón (evita que el círculo central quede descentrado)
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for(const seg of t.segments){
    minX = Math.min(minX, seg.x1, seg.x2); maxX = Math.max(maxX, seg.x1, seg.x2);
    minY = Math.min(minY, seg.y1, seg.y2); maxY = Math.max(maxY, seg.y1, seg.y2);
  }
  const center = { x:(minX+maxX)/2, y:(minY+maxY)/2 };

  // centro: espiral de Fibonacci con el angulo dorado, anclada al centro real
  const goldenAngle = 137.508*Math.PI/180;
  for(let k=0; k<140; k++){
    const r = 4*Math.sqrt(k);
    const theta = k*goldenAngle;
    t.penup();
    t.goto(center.x + r*Math.cos(theta), center.y + r*Math.sin(theta));
    t.stamp('#8B4513', 4);
  }

  return { segments:t.segments, petalCount, subSteps, radiusStart, center };
}

/* ---------------------------------------------------------------
   RENDER + ANIMACIÓN DE TRAZO
   ----------------------------------------------------------------*/
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let scale = 1, dpr = Math.min(window.devicePixelRatio,2);

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  scale = Math.min(w,h)/480;
}
resize();

let patternCenter = {x:0, y:0};
function toScreen(x,y){
  const w = canvas.width/dpr, h = canvas.height/dpr;
  return [w/2 + (x-patternCenter.x)*scale, h/2 - (y-patternCenter.y)*scale];
}

let program = null, revealed = 0, startTime = 0, rafId = null;
const DURATION = 6200;

function drawSegment(seg){
  if(seg.type==='line'){
    const [x1,y1] = toScreen(seg.x1, seg.y1);
    const [x2,y2] = toScreen(seg.x2, seg.y2);
    ctx.strokeStyle = seg.color;
    ctx.shadowColor = seg.color;
    ctx.shadowBlur = 5;
    ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  } else {
    const [x,y] = toScreen(seg.x, seg.y);
    ctx.fillStyle = seg.color;
    ctx.shadowColor = seg.color;
    ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(x,y, seg.r*scale, 0, Math.PI*2); ctx.fill();
  }
}

function drawMessageIfAny(){
  if(!MESSAGE) return;
  const [x,y] = toScreen(patternCenter.x, patternCenter.y-4);
  ctx.shadowBlur = 8; ctx.shadowColor = MESSAGE_COLOR;
  ctx.fillStyle = MESSAGE_COLOR;
  ctx.font = `italic ${Math.round(22*scale)}px Fraunces, serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(MESSAGE, x, y);
  ctx.shadowBlur = 0;
}

function frame(now){
  if(!startTime) startTime = now;
  const elapsed = now - startTime;
  const target = Math.min(program.segments.length, Math.floor((elapsed/DURATION)*program.segments.length));
  for(; revealed<target; revealed++) drawSegment(program.segments[revealed]);
  if(revealed < program.segments.length){
    rafId = requestAnimationFrame(frame);
  } else {
    drawMessageIfAny();
    canvas.classList.add('settled');
    document.getElementById('overlay').style.opacity = 1;
  }
}

function startDraw(seed){
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,w,h);
  canvas.classList.remove('settled');
  document.getElementById('overlay').style.opacity = 0;
  document.getElementById('seedTag').textContent = 'seed: ' + (seed>>>0).toString(16).padStart(8,'0');

  program = buildProgram(seed);
  patternCenter = program.center;
  revealed = 0; startTime = 0;
  if(rafId) cancelAnimationFrame(rafId);

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    program.segments.forEach(drawSegment);
    drawMessageIfAny();
    canvas.classList.add('settled');
    document.getElementById('overlay').style.opacity = 1;
    return;
  }
  rafId = requestAnimationFrame(frame);
}

let currentSeed = (Date.now() ^ Math.floor(Math.random()*1e9)) >>> 0;
startDraw(currentSeed);

document.getElementById('regen').addEventListener('click', () => {
  currentSeed = (Date.now() ^ Math.floor(Math.random()*1e9)) >>> 0;
  startDraw(currentSeed);
});

window.addEventListener('resize', () => {
  resize();
  startDraw(currentSeed);
});
</script>
</body>
</html>
